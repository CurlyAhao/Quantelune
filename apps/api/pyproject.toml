[project]
name = "statforge-api"
version = "0.1.0"
description = "StatForge API — AI-assisted applied statistics and machine learning workbench backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "deepagents==0.7.21",
    "duckdb>=1.5.4",
    "email-validator>=2.3.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "keyring==25.7.0",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "langgraph-checkpoint-sqlite==3.1.1",
    "matplotlib==3.11.2",
    "minio>=7.2.20",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "polars>=1.43.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary,pool]>=3.2.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pypdf==6.21.4",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn==0.13.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "statsmodels>=0.14.6",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP042: the codebase deliberately uses `(str, enum.Enum)` for SQLAlchemy Enum
# compatibility; converting to enum.StrEnum can break column type handling.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# The ML engine follows scikit-learn's `X` / `y` naming convention.
"app/ml/*" = ["N803", "N806"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
